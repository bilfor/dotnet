<style>
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 0.55rem;
    margin-bottom: 1.75rem;
    text-align: left;
  }

  .photo-grid img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 0;
    max-height: none;
    max-width: 100%;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    display: block;
  }

  .photo-grid img:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 93vw;
    max-height: 93vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
    margin-bottom: 0;
    max-width: 93vw;
    cursor: default;
  }

  .lightbox-close {
    position: fixed;
    top: 0.9rem;
    right: 1.2rem;
    color: #fffded;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0.65;
    font-family: sans-serif;
    user-select: none;
    transition: opacity 0.15s;
  }

  .lightbox-close:hover { opacity: 1; }

  .lightbox-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    cursor: default;
  }

  .lightbox-caption {
    color: #fffded;
    font-family: 'Frank Ruhl Libre', Georgia, serif;
    font-size: 0.95rem;
    opacity: 0.7;
    text-align: center;
    letter-spacing: 0.03em;
  }

</style>

<script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>
<script>
  const lightbox  = document.getElementById('lightbox');
  const lbImg     = document.getElementById('lightbox-img');
  const lbCaption = document.getElementById('lightbox-caption');

  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  function formatDate(d) {
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  function dateFromFilename(src) {
    const filename = src.split('/').pop();
    const m = filename.match(/^(\d{4})-(\d{1,2})-(\d{1,2})-/);
    if (m) {
      return formatDate(new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])));
    }
    return null;
  }

  async function getCaption(src) {
    const fromFilename = dateFromFilename(src);
    if (fromFilename) return fromFilename;
    try {
      const exif = await exifr.parse(src, ['DateTimeOriginal']);
      if (exif && exif.DateTimeOriginal) {
        return formatDate(new Date(exif.DateTimeOriginal));
      }
    } catch (e) {}
    return '';
  }

  document.querySelectorAll('.photo-grid img').forEach(img => {
    img.addEventListener('click', async () => {
      lbImg.src = img.src;
      lbCaption.textContent = '';
      lightbox.classList.add('open');
      const caption = await getCaption(img.src);
      lbCaption.textContent = caption;
    });
  });

  lightbox.addEventListener('click', e => {
    if (!e.target.closest('.lightbox-inner')) lightbox.classList.remove('open');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });
</script>
