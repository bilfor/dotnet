<style>
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 0.55rem;
    margin-bottom: 1.75rem;
    text-align: left;
  }

  .photo-grid img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 0;
    max-height: none;
    max-width: 100%;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    display: block;
  }

  .photo-grid img:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 93vw;
    max-height: 78vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
    margin-bottom: 0;
    cursor: default;
  }

  .lightbox-close {
    position: fixed;
    top: 0.9rem;
    right: 1.2rem;
    color: #fffded;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0.65;
    font-family: sans-serif;
    user-select: none;
    transition: opacity 0.15s;
  }

  .lightbox-close:hover { opacity: 1; }

  .lightbox-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    color: #fffded;
    font-size: 2.2rem;
    line-height: 1;
    cursor: pointer;
    opacity: 0.5;
    font-family: sans-serif;
    user-select: none;
    transition: opacity 0.15s;
    padding: 0.5rem 1rem;
  }

  .lightbox-nav:hover { opacity: 1; }
  #lightbox-prev { left: 0.5rem; }
  #lightbox-next { right: 0.5rem; }

  .lightbox-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    cursor: default;
  }

  .lightbox-caption {
    color: #fffded;
    font-family: 'Frank Ruhl Libre', Georgia, serif;
    font-size: 0.95rem;
    opacity: 0.7;
    text-align: center;
    letter-spacing: 0.03em;
    line-height: 1.4;
  }

  .lightbox-caption .credit {
    font-style: italic;
    font-size: 0.85em;

  }

</style>

                  'July','August','September','October','November','December'];

  function formatMonthYear(d) {
    return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function dateFromFilename(src) {
    const filename = src.split('/').pop();
    const m = filename.match(/^(\d{4})-(\d{1,2})-(\d{1,2})-/);
    if (m) {
      return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    }
    return null;
  }

  function dateFromAttr(val) {
    if (!val) return null;
    // Accept "YYYY-MM" or "YYYY-MM-DD"
    const m = val.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/);
    if (!m) return null;
    return new Date(parseInt(m[1]), parseInt(m[2]) - 1, m[3] ? parseInt(m[3]) : 1);
  }

  async function resolveDate(img) {
    const fromAttr = dateFromAttr(img.dataset.date);
    if (fromAttr) return fromAttr;
    const fromFilename = dateFromFilename(img.src);
    if (fromFilename) return fromFilename;
    try {
      const exif = await exifr.parse(img.src, ['DateTimeOriginal']);
      if (exif && exif.DateTimeOriginal) return new Date(exif.DateTimeOriginal);
    } catch (e) {}
    return null;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function buildCaption(img) {
    const place = img.dataset.place;
    const photographer = img.dataset.photographer;
    const date = await resolveDate(img);

    const lines = [];
    if (place) lines.push(escapeHtml(place));
    if (date) lines.push(escapeHtml(formatMonthYear(date)));
    if (photographer) lines.push('<span class="credit">Photo by ' + escapeHtml(photographer) + '</span>');
    return lines.join('<br>');
  }

  const gridImgs = Array.from(document.querySelectorAll('.photo-grid img'));
  let currentIdx = 0;

  async function showImg(idx) {
    currentIdx = (idx + gridImgs.length) % gridImgs.length;
    const img = gridImgs[currentIdx];
    lbImg.src = img.src.replace('/imgs/thumbs/', '/imgs/');
    lbCaption.innerHTML = '';
    lbCaption.innerHTML = await buildCaption(img);
  }

  gridImgs.forEach((img, idx) => {
    img.addEventListener('click', () => {
      lightbox.classList.add('open');
      showImg(idx);
    });
  });

  document.getElementById('lightbox-prev').addEventListener('click', e => {
    e.stopPropagation();
    showImg(currentIdx - 1);
  });

  document.getElementById('lightbox-next').addEventListener('click', e => {
    e.stopPropagation();
    showImg(currentIdx + 1);
  });

  lightbox.addEventListener('click', e => {
    if (!e.target.closest('.lightbox-inner') && !e.target.closest('.lightbox-nav')) {
      lightbox.classList.remove('open');
    }
  });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') lightbox.classList.remove('open');
    if (e.key === 'ArrowLeft') showImg(currentIdx - 1);
    if (e.key === 'ArrowRight') showImg(currentIdx + 1);
  });
</script>
