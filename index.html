<script>
(function() {
  const hpImg = document.getElementById('homepage-pic');
  if (!hpImg) return;
  let photos = [];
  let cursor = 0;

  fetch('/pages/photos.html')
    .then(r => r.text())
    .then(html => {
      const matches = html.match(/src="\.\.\/imgs\/thumbs\/[^"]+\.(jpg|jpeg|png|webp|JPG)"/gi) || [];
      photos = matches
        .map(s => s.slice(6, -1))                  // strip src=" and trailing "
        .map(p => p.replace(/^\.\.\//, '/'))       // ../imgs/... -> /imgs/...
        .map(p => p.replace('/thumbs/', '/'));     // thumb -> full
      // Fisher-Yates shuffle
      for (let i = photos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [photos[i], photos[j]] = [photos[j], photos[i]];
      }
    });

  hpImg.addEventListener('click', () => {
    if (!photos.length) return;
    hpImg.src = photos[cursor];
    cursor = (cursor + 1) % photos.length;
  });
})();
</script>
